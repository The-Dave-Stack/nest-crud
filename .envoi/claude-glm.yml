---
name: "Claude Code Runner using z.ai API (GLM 4.7)"
description: "Configuration to initialize Claude Code using z.ai API (GLM 4.7) and secrets from OpenBao."
tags:
  - claude
  - z.ai
  - ai
  - openbao
---

providers:  
  openbao:
    type: openbao
    enabled: true
    config:
      address: "https://openbao.thedavestack.com"
      token: "${OPENBAO_TOKEN}"

# Default command to execute when no command-line arguments are provided
command:
  default: "claude"
  description: "Run Claude Code using z.ai API (GLM 4.7)"
  
variables:
  - name: ANTHROPIC_BASE_URL
    required: true
    description: "Claude Code API base URL"
    source:
      type: openbao
      path: local/data/aiassistants
      namespace: tds
  - name: ANTHROPIC_AUTH_TOKEN
    required: true
    description: "Claude Code API authentication token"
    source:
      type: openbao
      path: local/data/aiassistants
      namespace: tds
  - name: ANTHROPIC_MODEL
    required: true
    description: "Claude Code model to use"
    source:
      type: openbao
      path: local/data/aiassistants
      namespace: tds
  - name: ANTHROPIC_DEFAULT_HAIKU_MODEL
    required: true
    description: "Claude Code default haiku model to use"
    source:
      type: openbao
      path: local/data/aiassistants
      namespace: tds
  - name: ANTHROPIC_DEFAULT_SONNET_MODEL
    required: true
    description: "Claude Code default sonnet model to use"
    source:
      type: openbao
      path: local/data/aiassistants
      namespace: tds
  - name: ANTHROPIC_DEFAULT_OPUS_MODEL
    required: true
    description: "Claude Code default opus model to use"
    source:
      type: openbao
      path: local/data/aiassistants
      namespace: tds    
  - name: ANTHROPIC_SMALL_FAST_MODEL
    required: true
    description: "Claude Code small fasth model to use"
    source:
      type: openbao
      path: local/data/aiassistants
      namespace: tds
  - name: CONTEXT7_API_KEY
    required: true
    description: "Context7 API key"
    source:
      type: openbao
      path: local/data/mcp
      namespace: tds